<!doctype html><html lang="lv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6fa"><title>QuickQR — QR kodu ģenerators</title></head><body><main><header><span class="brand">▦ QuickQR</span><span class="tag">Bezmaksas · Bez reģistrācijas</span></header><section><div class="intro"><span class="eyebrow">SAITE → QR KODS</span><h1>No saites līdz QR kodam.</h1><p>Ievadi saiti, ģenerē QR kodu un lejupielādē to dažu sekunžu laikā.</p></div><div class="panel"><form id="form"><label for="url">Tava saite</label><input id="url" placeholder="https://example.com" required autocomplete="url" inputmode="url"><button type="submit">Ģenerēt QR kodu <span>→</span></button><p id="error" role="alert"></p></form><div class="preview"><div class="qrbox" id="qrbox"><div id="placeholder"><span>▦</span><p>Šeit būs tavs QR kods</p></div><canvas id="qr" hidden></canvas></div><div class="downloads"><button id="png" disabled>↓ PNG</button><button id="svg" disabled>↓ SVG</button></div><p class="hint" id="status" aria-live="polite">Augsta kvalitāte · 1024 × 1024 px</p></div></div></section><footer>QuickQR · Tavas saites netiek saglabātas.</footer></main><script type="module" src="/src.js"></script></body></html>
